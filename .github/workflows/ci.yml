name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.11 は下限、3.14 は Arch が配っている版
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: 偽のファイルシステムでのテスト
        run: python tests/run_all.py

      # 本物のシステムで一覧を出せるか(消さない)。Ubuntu なので pacman 系は「無し」になる
      - name: 実物で --report / --json / clean の dry-run
        run: |
          python -m disksift --report
          python -m disksift --json > /dev/null
          python -m disksift clean user-cache
